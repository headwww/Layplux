name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # install 在 version 之前，此时 lockfile 还是一致的
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 检测是否有待发布的 changeset 文件
      - name: Check for changesets
        id: check
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # 修改 package.json 版本号和 CHANGELOG，不碰 lockfile
      - name: Version packages
        if: steps.check.outputs.has_changes == 'true'
        run: pnpm changeset version

      - name: Build
        if: steps.check.outputs.has_changes == 'true'
        run: pnpm --filter layplux build

      # 把版本号变更（package.json + CHANGELOG）推回 master
      # lockfile 没有变动，所以下次 CI --frozen-lockfile 不会报错
      - name: Commit and push version bump
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version packages [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.check.outputs.has_changes == 'true'
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
