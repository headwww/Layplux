name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxlint .
      - run: pnpm exec eslint .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/layplux exec vue-tsc --noEmit

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build layplux
        run: pnpm -C build-script exec gulp build

      - name: Verify dist
        run: |
          test -f packages/layplux/dist/esm/index.mjs
          test -f packages/layplux/dist/cjs/index.cjs
          test -f packages/layplux/dist/umd/index.js
          test -f packages/layplux/dist/style/index.css
          test -f packages/layplux/dist/types/index.d.ts

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/layplux/dist/
